<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出身地ズバリ診断</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{color-scheme:light;--ink:#1f2547;--sub:#6c7192;--line:#e9eaf5;--coral:#ff5b6e;--peach:#ff8a5c;--sky:#4f8cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);
background:radial-gradient(55vmax 55vmax at 0% 0%,#ffe3d3 0,transparent 60%),radial-gradient(55vmax 55vmax at 100% 100%,#d6e8ff 0,transparent 60%),#fcfaf7;
display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{width:100%;max-width:440px;box-sizing:border-box;text-align:center;background:#fff;border:1px solid rgba(31,37,71,.06);
border-radius:30px;padding:32px 24px 28px;box-shadow:0 24px 60px -24px rgba(50,60,130,.3)}
.hide{display:none}
.tile{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;display:grid;place-items:center;font-size:2.6rem;
background:linear-gradient(135deg,#ffd9c4,#ffc2d1);box-shadow:0 10px 24px -10px rgba(255,91,110,.55)}
h1{font-size:1.75rem;font-weight:900;line-height:1.35;margin:.1em 0 .5em;letter-spacing:.02em}
h1 span{background:linear-gradient(90deg,var(--peach),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--sub);line-height:1.8;margin:.4em 0;font-size:.95rem}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;transition:transform .12s,box-shadow .12s,opacity .12s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
.main{display:block;width:100%;margin-top:22px;padding:15px;font-size:1.1rem;color:#fff;background:linear-gradient(90deg,var(--peach),var(--coral));box-shadow:0 12px 24px -10px rgba(255,91,110,.7)}
.pill{display:inline-block;background:#f1f3fd;color:var(--sub);border-radius:999px;padding:6px 14px;font-size:.85rem}
.pill b{color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
.q{margin:18px 0 8px;font-size:.95rem;color:var(--sub)}
.name{font-size:clamp(2.2rem,11vw,3rem);font-weight:900;letter-spacing:.06em;word-break:break-all;padding:26px 10px;border-radius:22px;
background:linear-gradient(180deg,#fff,#fff6f1);border:2px solid #ffe0d2;box-shadow:inset 0 -6px 0 rgba(255,138,92,.12)}
.yn{display:flex;gap:12px;margin-top:20px}
.yn button{flex:1;padding:15px 0;font-size:1.1rem}
#y{color:#fff;background:linear-gradient(90deg,var(--peach),var(--coral));box-shadow:0 12px 24px -10px rgba(255,91,110,.7)}
#n{color:var(--ink);background:#fff;border:2px solid var(--line);box-shadow:0 6px 14px -8px rgba(31,37,71,.25)}
.auto{margin-top:22px;padding:14px;border-radius:20px;background:#f3f6ff;border:1px solid #e1e8ff}
.auto p{margin:0 0 10px;font-size:.82rem}
select{font:inherit;font-weight:500;width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;border:2px solid #dbe4ff;background:#fff;color:var(--ink)}
.answer{margin:16px 0;padding:22px 10px;border-radius:22px;font-size:2.6rem;font-weight:900;letter-spacing:.06em;color:#fff;
background:linear-gradient(135deg,var(--peach),var(--coral) 55%,#c25bff);box-shadow:0 16px 30px -14px rgba(255,91,110,.7)}
.share{display:block;margin-top:18px;padding:14px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-weight:700}
.again{display:block;width:100%;margin-top:10px;padding:12px;background:transparent;color:var(--sub);border:2px solid var(--line)}
</style>
</head>
<body>
<main class="card">
  <section id="start">
    <div class="tile">🗾</div>
    <h1>あなたの出身地、<br><span>ズバリ</span>当てます</h1>
    <p>独自のアルゴリズムで、出身地を導き出します。</p>
    <p>質問に「はい」か「いいえ」でお答えください。</p>
    <button class="main" id="go">診断をはじめる</button>
  </section>

  <section id="quiz" class="hide">
    <span class="pill">質問回数 <b id="cnt">0</b> 回</span>
    <p class="q">ここがあなたの出身地ですか?</p>
    <div class="name" id="name"></div>
    <div class="yn"><button id="y">はい</button><button id="n">いいえ</button></div>
    <div class="auto hide" id="auto"><p>オートモード:出身地を選ぶと、自動で高速に質問します</p><select id="sel"><option value="">都道府県を選択</option></select></div>
  </section>

  <section id="end" class="hide">
    <div class="tile">🎉</div>
    <p style="margin:0">診断結果が出ました</p>
    <p style="font-weight: bold; margin-top: 20px;">あなたの出身地は...</p>
    <div class="answer" id="ans"></div>
    <p>質問回数は <b id="fin" style="color:var(--coral)"></b> 回でした。<br>ご協力ありがとうございました。</p>
    <a class="share" id="x" target="_blank" rel="noopener">𝕏 でシェアする</a>
    <button class="again" id="again">もう一度診断する</button>
  </section>
</main>

<script>
const P=["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const SUF=["都","道","府","県"];
const POOL=[0,1,2].map(i=>[...new Set(P.map(p=>p.slice(0,-1)).filter(s=>s.length>i).map(s=>s[i]))]);
const $=id=>document.getElementById(id);
const show=id=>["start","quiz","end"].forEach(s=>$(s).classList.toggle("hide",s!==id));
const pick=a=>a[Math.floor(Math.random()*a.length)];
let count=0,cur="";
function next(){
  const n=Math.random()<0.8?2:3;
  let s="";for(let i=0;i<n;i++)s+=pick(POOL[i]);
  cur=s+pick(SUF);
  count++;
  $("cnt").textContent=count.toLocaleString();
  $("name").textContent=cur;
  $("auto").classList.toggle("hide",count<=30);
}
function start(){count=0;show("quiz");next()}
$("go").onclick=start;
$("again").onclick=start;
$("n").onclick=()=>{next()};
$("y").onclick=()=>{
  $("ans").textContent=cur;
  $("fin").textContent=count.toLocaleString();
  const t=count.toLocaleString()+"回目の質問で、私の出身地は「"+cur+"」と判定されました。 #出身地ズバリ診断\n\nhttps://e6nlaq.github.io/zubari/";
  $("x").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(t);
  show("end");
};
const sel=$("sel");
P.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p;sel.appendChild(o)});
sel.onchange=()=>{
  if(sel.value==="")return;
  const t=P[+sel.value],L=t.length-1;
  const tc=[...t.slice(0,L)],ts=SUF.indexOf(t[L]);
  $("y").disabled=$("n").disabled=sel.disabled=true;
  const step=()=>{
    let li=[],ls=0;
    for(let k=0;k<67;k++){
      count++;
      const n=Math.random()<0.8?2:3;
      let ok=n===L;
      const idx=[];
      for(let i=0;i<n;i++){const c=pick(POOL[i]);idx.push(c);if(ok&&c!==tc[i])ok=false}
      const s=(Math.random()*4)|0;
      li=idx;ls=s;
      if(ok&&s===ts){
        cur=t;
        $("y").disabled=$("n").disabled=sel.disabled=false;
        sel.value="";
        $("y").onclick();
        return;
      }
    }
    $("cnt").textContent=count.toLocaleString();
    $("name").textContent=li.join("")+SUF[ls];
    setTimeout(step,20);
  };
  setTimeout(step,25);
};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide"))return;
  if(e.key==="y"||e.key==="Y")$("y").click();
  if(e.key==="n"||e.key==="N")$("n").click();
});
</script>
</body>
</html>
